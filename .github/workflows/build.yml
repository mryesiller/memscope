name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build MemScope.app
        run: ./build.sh

      - name: Zip app
        run: cd build && ditto -c -k --keepParent MemScope.app MemScope.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MemScope
          path: build/MemScope.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MemScope.zip
          generate_release_notes: true
